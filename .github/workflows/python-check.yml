name: Python syntax check

on:
  push:
    branches: ["main", "feature/toss-open-api-support"]
  pull_request:
    branches: ["main"]

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile application modules
        run: python -m compileall -q app.py predash tests
      - name: Run Toss adapter tests
        run: python -m unittest discover -s tests -v
